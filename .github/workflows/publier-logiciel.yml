# Publie chaque nouvelle version du logiciel dans les « Releases » du dépôt :
# GitHub y compte tout seul chaque téléchargement (compteur affiché sur le site et dans votre tableau de bord).
# Se lance tout seul quand un nouveau .exe (ou .zip Mac) est envoyé dans le dossier « telechargement ».
name: Publier le logiciel

on:
  push:
    branches: [main]
    paths: ["telechargement/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="logiciel-$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          FICHIERS=""; SYSTEMES="Windows"
          for f in telechargement/MaBoussole-Setup.exe telechargement/MaBoussole-Mac.zip; do
            if [ -f "$f" ]; then FICHIERS="$FICHIERS $f"; fi          # la version Mac s'ajoute quand elle existe
          done
          if [ -f telechargement/MaBoussole-Mac.zip ]; then SYSTEMES="Windows et Mac"; fi
          gh release create "$TAG" $FICHIERS --title "MaBoussole Graphiques $(date -u +%d/%m/%Y)" \
            --notes "Nouvelle version de MaBoussole Graphiques ($SYSTEMES)." --latest
